<div class="card">

            <div class="mb-3">
                <label for="username" class="form-label">البريد الإلكتروني أو اسم المستخدم أو رقم الهاتف</label>
                <div class="input-group input-group-merge">
                    <input type="text" class="form-control" id="username" name="username"

                    <span class="input-group-text cursor-pointer text-primary">

            <div class="mb-3 form-password-toggle">

                        <small>هل نسيت كلمة المرور؟</small>
                    </a>
                </div>
                <div class="input-group input-group-merge">
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="أدخل كلمة المرور" aria-describedby="password"

                    <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                </div>
            </div>
            <div class="mb-3">

            </div>
            <div class="mb-3">

        </form>

        <!--  Passkey Divider  -->
        <div class="passkey-divider">
            <span>or</span>
        </div>

        <!--  Passkey Login Button  -->
        <button id="btn-passkey-login" class="btn-passkey mb-3" type="button" onclick="handlePasskeyLogin()">

            <span class="btn-passkey-label">تسجيل الدخول باستخدام Passkey</span>
            <span class="btn-passkey-badge"><i class="bx bx-chevron-right"></i></span>
        </button>

<!-- webauthn scripts  -->
<script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<script src="/js/passkey-login.js"></script>

<script>
    function submitForm() {
        const form = document.getElementById("login-form");
        $('input[name="auth_token"]').val(window.localStorage.getItem("auth-token"));
        const username = $('input[name="username"]').val().trim();
        const password = $('input[name="password"]').val().trim();
        if (!username || !password) return;
        localStorage.removeItem("last-username")
        form.submit();
    }

    $('input').change(function () { $('.login-error').alert('close') });
</script>


<script>
    const savedUsername = localStorage.getItem("last-username");
    if (!localStorage.getItem("auth-token")) localStorage.setItem("auth-token", "6a070368ecea19ad10be3bafda95dbeb5138086f21a616f4a944050209121e9c")
    const authToken = localStorage.getItem("auth-token");
    if (savedUsername) {
        $("#saved-username-passkey").removeClass("d-none");
        $("#username").addClass("fw-bold")
        $("#username").val(savedUsername);
        $('#username').on('input', function () {
            $("#saved-username-passkey").addClass("d-none");
            $("#username").removeClass("fw-bold")
        });
    }

    async function handlePasskeyLogin() {
        $("#passkey_error_alert").addClass("d-none")
        const username = $('input[name="username"]').val().trim();
        if (!username) {
            $("#passkey_error_alert").removeClass("d-none");
            $("#passkey_error_alert").text("أدخل اسم المستخدم الخاص بك لتسجيل الدخول باستخدام Passkey");
            return;
        }
        const result = await doPasskeyLogin(username, authToken);

        if (!result) return; // silently cancelled

        if (result.error) {
            $("#passkey_error_alert").removeClass("d-none");
            $("#passkey_error_alert").text(result.error.message);

        } else if (result.success) {
            localStorage.setItem("last-username", username)
            window.location.href = '/';
        }
    }
</script>
