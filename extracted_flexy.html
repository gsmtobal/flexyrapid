<script>
    const MAX_AMOUNT_LONG = 6
    var phoneNumber = "";
    var amount = ""

    $("#phoneNumber").on("keyup change input", function (e) {
        // Remove contact name if phoneNumber edited
        $("#phoneNumber-tooltip").text("")

        let value = this.value
        value = value.replace(/[^0-9]+/g, '');
        value = value.substr(0, 10)

        phoneNumber = value

        if (value.startsWith('0')) {
            if (value.startsWith('05')) {
                $('#operatorLogo').css("background-image", "url(/images/logo_ooredoo.png)");
                $('#flexyTypeLabel2').text("سبقلي")
                $('#flexyTypeRadio2').val("Sabbaqli")
                $('#flexyTypeLabel3').text("الشركات")
                $('#flexyTypeRadio3').val("Enterprise")
                $('#flexyTypeLabel2').show()
            }
            else if (value.startsWith('06')) {
                $('#operatorLogo').css("background-image", "url(/images/logo_mobilis.png)");
                $('#flexyTypeLabel2').text("فاتورة")
                $('#flexyTypeRadio2').val("Normal")
                $('#flexyTypeLabel3').text("دولي")
                $('#flexyTypeRadio3').val("International")
                $('#flexyTypeLabel2').show()
            }
            else if (value.startsWith('07')) {
                $('#operatorLogo').css("background-image", "url(/images/logo_djezzy.png)");
                $('#flexyTypeLabel2').text("")
                $('#flexyTypeRadio2').val("")
                $('#flexyTypeLabel3').text("فاتورة")
                $('#flexyTypeRadio3').val("Facture")
                $('#flexyTypeLabel2').hide()
            }
            else {
                value = "0"
                $('#operatorLogo').css("background-image", "none");
                $('#flexyTypeLabel2').text("")
                $('#flexyTypeRadio2').val("")
                $('#flexyTypeLabel3').text("")
                $('#flexyTypeRadio3').val("")
                $('#flexyTypeLabel2').hide()
                $("#flexyTypeRadio1").prop("checked", true);
            }
        } else {
            value = ""
            $('#operatorLogo').css("background-image", "none");
            $('#flexyTypeLabel2').text("")
            $('#flexyTypeRadio2').val("")
            $('#flexyTypeLabel3').text("")
            $('#flexyTypeRadio3').val("")
            $('#flexyTypeLabel2').hide()
            $("#flexyTypeRadio1").prop("checked", true);
        }

        if (value.length == 10) {
            $('#flexyPills').show()
            $('button[data-bs-target="#navs-pills-justified-balance"]').tab('show').trigger('shown');
            $('button[data-bs-target="#navs-pills-justified-offers"]').prop("disabled", false);
            $('#amount').focus()
            $('#sabbaqliText').hide()
            $("#offersList").html("")
            $('#offerSpinner').show()
            scrollToElement('#phoneNumber')
        } else {
            $('#flexyPills').hide()
        }

        let valueFormat = value.match(/\d{1,2}/g)
        if (valueFormat) valueFormat = valueFormat.join(' ')

        this.value = valueFormat || ""
    })


    $("#amount").on("keyup change input", function (e) {
        let value = this.value
        value = value.replace(/[^0-9]+/g, '');
        value = value.substr(0, MAX_AMOUNT_LONG)

        let valueFormat = formatBalance(value)

        if (valueFormat && valueFormat != "0")
            this.value = valueFormat
        else this.value = ""

        amount = value
    })

    $(".preDefinedAmount").on("click", function (e) {
        $("#amount").val(this.dataset.amount)
        $("#amount").change()
    })
</script>

<script>
    $("#sendBalanceBtn").click(async function () {
        // console.log({ phoneNumber, amount })
        if (amount >= 5000) {
            if (phoneNumber.startsWith('06')) return
            let swalResult = await Swal.fire({
                title: `هل تريد إرسال مبلغ <span class="text-danger">${formatBalance(amount)}</span> دج `,
                input: 'number',
                inputLabel: `أعد كتابة المبلغ للتأكيد`,
                inputPlaceholder: "المبلغ",
                icon: 'warning',
                showCancelButton: true,
                cancelButtonText: "إلغاء",
                confirmButtonText: "تأكيد",
                inputValidator: (value) => {
                    if (value != amount) {
                        return `أعد كتابة  : <b>${amount}</b>`
                    }
                }
            })
            if (swalResult.isConfirmed == false) return
        }

        if (await hasRecentOperationFromTable(phoneNumber)) return

        let type = $("input[name='flexy_type']:checked").val()
        if (phoneNumber.length == 10)
            if (amount >= 100 || phoneNumber.startsWith('06') && amount >= 40) {
                $(this).prop("disabled", true);
                fetch(RACINE_PATH + "/flexyBalance", {
                    method: 'post',
                    headers: {
                        "Content-type": "application/json"
                    },
                    body: JSON.stringify({ phoneNbr: phoneNumber, balance: amount, flexyType: type })
                })
                    .then((response) => {
                        if (response.status == 200) {
                            response.json().then((body) => {
                                if (body.error) {
                                    $('#toastError .toast-body')
                                        .text(body.error.message_ar || body.error.message)
                                    $('#toastError').toast('show')
                                    //$("#phoneNumber").val("").change()
                                    //$("#amount").val("").change()
                                } else {
                                    $('#toastSuccess').toast('show')
                                    $("#phoneNumber").val("").change()
                                    $("#amount").val("").change()
                                    $('#transactionsTable').DataTable().draw()
                                    $("#phoneNumber").focus()
                                    // scrollToElement('#transactionsCard', 500)
                                }
                                //console.log(body)
                            });
                        }
                        $(this).prop("disabled", false);
                    })
                    .catch(function (error) {
                        console.log("Request failed", error);
                        $(this).prop("disabled", true);
                    });
            }
    })

</script>

            let swalResult = await Swal.fire({
                html: `هل ترغب في إرسال عملية أخرى إلى هذا الرقم <span class="text-danger"> ${phoneNumber} </span> ؟`,
                icon: 'warning',
                showCancelButton: true,
                cancelButtonText: "إلغاء",
                confirmButtonText: "تأكيد",
            })
            if (swalResult.isConfirmed == false) return true
        }
    }
</script>

<script>

            if (checkSabbaqliFromTable) {
                setTimeout(() => {
                    $('#sabbaqliText').show()
                    $('#sabbaqliAmount').text(checkSabbaqliFromTable.sabbaqliAmount)
                    $("#flexyTypeRadio2").prop("checked", true);
                    $('button[data-bs-target="#navs-pills-justified-offers"]').prop("disabled", true);
                }, 100);
                return
            }
            isCheckingSabbaqli = true
            fetch(RACINE_PATH + "/checkSabbaqli?phoneNbr=" + phoneNumber)
                .then((response) => {
                    isCheckingSabbaqli = false
                    lastCheckedNumber = phoneNumber
                    if (response.status == 200) {
                        response.json().then((body) => {
                            // console.log(body)
                            if (body.sabbaqliAmount) {
                                $('#sabbaqliText').show()
                                $('#sabbaqliAmount').text(body.sabbaqliAmount)
                                $("#flexyTypeRadio2").prop("checked", true);
                                $('button[data-bs-target="#navs-pills-justified-offers"]').prop("disabled", true);
                            }
                        });
                    }
                })
                .catch(function (error) {
                    console.log("Request failed", error);
                });
        }
    })

    function hasSabbaqliFromTable(phoneNumber) {
        let lastOpeartion = table.data().toArray().find(e => e.param_1 == phoneNumber)
        if (lastOpeartion && lastOpeartion.message.includes("SABBAQLI")) {
            var sabbaqliAmount = parseInt(lastOpeartion.message.match(/\d+ DA/g)[0]);
            return { sabbaqliAmount }
        }
    }
</script>

<script>
    // Time to refresh the table whene there is a pending operation
    const REFRESH_TABLE_TIME = 3_000
    // Set of penidng opearions (used to playsound)
    const PENDING_OPERATIONS_SET = new Set();

    var table = $('#transactionsTable').DataTable();
    $('#transactionsTable').on('draw.dt', function () {
        $('td.type-td').each(function () {
            let data = table.row($(this).parents('tr')).data()
            let sub_type = data.sub_type == "flexy_offer" ? "عرض" : "رصيد"

            switch ($(this).text()) {
                case "mobilis":
                    $(this).html('<img src="/images/logo_mobilis.png" alt="Mobilis logo" class="operation-logo"> ' + sub_type)
                    break;
                case "djezzy":
                    $(this).html('<img src="/images/logo_djezzy.png" alt="Djezzy logo" class="operation-logo"> ' + sub_type)
                    break;
                case "ooredoo":
                    $(this).html('<img src="/images/logo_ooredoo.png" alt="Ooredoo logo" class="operation-logo"> ' + sub_type)
                    break;
            }
        });

        $('td.status-td').each(function () {
            switch ($(this).text()) {
                case "success":
                    $(this).html('<span class="badge bg-success">ناجحة</span>')
                    break;
                case "error":
                    $(this).html('<span class="badge bg-danger">فاشلة</span>')
                    break;
                case "pending":
                    $(this).html('<span class="spinner-border text-primary" role="status"></span>')
                    break;
            }
        });

        $('td.item_name-td').each(function () {
            switch ($(this).text()) {
                case "Normal":
                    $(this).html("عادي")
                    break;
                case "Sabbaqli":
                    $(this).html("سبقلي")
                    break;
                case "Enterprise":
                    $(this).html("الشركات")
                    break;
                case "International":
                    $(this).html("دولي")
                    break;
                case "Facture":
                    $(this).html("فاتورة")
                    break;
            }
        });

        // Redraw the table if there is a pending operation
        for (let i = 0; i < table.data().length; i++) {
            const e = table.data()[i];
            if (e.status == 'pending') {
                setTimeout(() => {
                    table.ajax.reload(null, false);
                    updateBalanceSpan()
                }, REFRESH_TABLE_TIME);
                break
            }
        }

        // Used to playsound
        for (let i = 0; i < table.data().length; i++) {
            const e = table.data()[i];
            if (e.status == 'pending') {
                PENDING_OPERATIONS_SET.add(e.id)
            } else if (PENDING_OPERATIONS_SET.has(e.id)) {
                PENDING_OPERATIONS_SET.delete(e.id)
                let soundCode = e.status == "success" ? "SUCCESS" : "ERROR"
                playSound(soundCode)
            }
        }
    })
</script>
